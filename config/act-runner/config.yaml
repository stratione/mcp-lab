# act_runner config for the lab's Gitea Actions runner.
# Mounted read-only at /config.yaml by docker-compose (act-runner service).
# Minimal subset of the upstream format:
# https://gitea.com/gitea/act_runner — `act_runner generate-config`.

log:
  level: info

runner:
  # Registration state lives on the act-runner-data volume (the service's
  # working dir is /data), so re-creating the container doesn't re-register.
  file: .runner
  capacity: 1
  timeout: 3h
  fetch_timeout: 5s
  fetch_interval: 2s

cache:
  enabled: false

container:
  # Job containers join the lab network so steps can reach gitea:3000,
  # registry-dev:5000, chat-ui:3001, trivy:8080, etc. by service name.
  network: mcp-lab-net
  privileged: false
  # act_runner already bind-mounts the host engine socket into every job
  # container (sibling containers, no DinD), so `docker build` in a step talks
  # to the same daemon the lab runs on. Do NOT add it again via `options` — a
  # second `-v /var/run/docker.sock:...` makes the daemon reject the job with
  # "Duplicate mount point". valid_volumes still whitelists the socket so a
  # workflow may mount it explicitly if it ever needs to.
  options: ""
  # Lab images (mcp-lab-ci-base) only exist locally — a pull would fail.
  force_pull: false
  valid_volumes:
    - /var/run/docker.sock

host:
  workdir_parent: /data/workdir
